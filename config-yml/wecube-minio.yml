---
# Headless Service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: wecube-minio
  namespace: demo-myapp
  labels:
    app: wecube-minio
spec:
  ports:
  - port: 9000
    name: api
  clusterIP: None
  selector:
    app: wecube-minio

---
# 共享 PVC：存储 MinIO 数据，所有 Pod 共用同一份数据，互相可见
# 需要 StorageClass "nfs" 支持 ReadWriteMany（NFS 天然支持）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wecube-minio-data
  namespace: demo-myapp
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: "nfs"
  resources:
    requests:
      storage: 50Gi

---
# 共享 PVC：存储 MinIO 配置，所有 Pod 共用同一份配置
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wecube-minio-config
  namespace: demo-myapp
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: "nfs"
  resources:
    requests:
      storage: 1Gi

---
# StatefulSet for MinIO
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wecube-minio
  namespace: demo-myapp
  labels:
    app: wecube-minio
spec:
  serviceName: "wecube-minio"
  replicas: 1
  selector:
    matchLabels:
      app: wecube-minio
  template:
    metadata:
      labels:
        app: wecube-minio
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: init-minio-data
        image: 192.168.150.6:30816/library/busybox:latest
        command:
        - sh
        - -c
        - |
          echo "Initializing minio data directory permissions..."
          mkdir -p /data
          mkdir -p /root/.minio
          mkdir -p /data/wecube-plugin-package-bucket
          mkdir -p /data/salt-tmp
          mkdir -p /data/taskman-file
          mkdir -p /data/terminal
          mkdir -p /data/wecube-agent
          mkdir -p /data/wecube-artifacts
          chown -R 1000:1000 /data
          chown -R 1000:1000 /root/.minio
          chmod -R 755 /data
          chmod -R 755 /root/.minio
          echo "Permissions initialized successfully"
          ls -la /data
        volumeMounts:
        - name: wecube-minio-data
          mountPath: /data
        - name: wecube-minio-config
          mountPath: /root/.minio
        securityContext:
          runAsUser: 0
      containers:
      - name: wecube-minio
        image: 192.168.150.6:30816/library/minio:latest
        imagePullPolicy: IfNotPresent
        command:
        - minio
        - server
        - /data
        securityContext:
          runAsUser: 1000
        ports:
        - containerPort: 9000
          name: api
        env:
        - name: MINIO_ACCESS_KEY
          value: "access_key"
        - name: MINIO_SECRET_KEY
          value: "secret_key"
        volumeMounts:
        - name: wecube-minio-data
          mountPath: /data
        - name: wecube-minio-config
          mountPath: /root/.minio
        - name: localtime
          mountPath: /etc/localtime
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: localtime
        hostPath:
          path: /etc/localtime
          type: File
      # 引用共享 PVC，所有 Pod 挂载同一个 PVC，数据互相可见
      - name: wecube-minio-data
        persistentVolumeClaim:
          claimName: wecube-minio-data
      - name: wecube-minio-config
        persistentVolumeClaim:
          claimName: wecube-minio-config
  # 移除 volumeClaimTemplates：原来每个 Pod 会自动创建独立 PVC（RWO，数据隔离）
  # 改为在上方 volumes 中引用共享 PVC，所有 Pod 共用同一份存储
